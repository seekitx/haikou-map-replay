<style>

isplay:flex;align-items:center;gap:9px;color:#9aada7;font-size:12px;margin-top:15px}.legend i{width:22px;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 8px #b4f47780}.legend .faint{background:#759592;box-shadow:none}.side-bottom{margin-top:auto;font-size:11px;line-height:1.8;color:#657b75}.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background-image:linear-gradient(#80b3a508 1px,transparent 1px),linear-gradient(90deg,#80b3a508 1px,transparent 1px);background-size:32px 32px}.stage-head{position:absolute;z-index:2;top:24px;left:28px;pointer-events:none}.stage-kicker{font-size:10px;letter-spacing:.18em;color:#88a8a0}.stage-name{font-size:14px;color:#d5e3dc;margin-top:7px}.stage-right{position:absolute;top:24px;right:28px;z-index:2;color:#8aa297;font-size:11px}.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.map.dragging{cursor:grabbing}.map{transform-origin:50% 50%;transition:transform .55s cubic-bezier(.2,.7,.2,1);will-change:transform}.stage.mode-3d .map{transform:perspective(1450px) rotateX(42deg) rotateZ(-5deg) scale(1.16);filter:drop-shadow(0 26px 25px #000a)}.view-switch{position:absolute;z-index:3;top:58px;right:26px;display:flex;gap:3px;padding:4px;border:1px solid #506961;background:#0d1e20e8;border-radius:9px}.view-switch button{padding:6px 10px;border:0;border-radius:6px;background:transparent;color:#91a79d;font-size:11px}.view-switch button[aria-pressed="true"]{background:#b4f477;color:#14221b;font-weight:650}.view-caption{position:absolute;z-index:2;right:27px;top:102px;font-size:10px;color:#91aa9e;pointer-events:none;text-align:right}@media(max-width:700px){.view-switch{top:54px;right:14px}.view-caption{top:98px;right:16px}.stage.mode-3d .map{transform:perspective(1100px) rotateX(38deg) rotateZ(-5deg) scale(1.18)}}.map-image{filter:url(#tint)}.full-route,.travelled{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.full-route{stroke:#82af9c;stroke-width:1.3;opacity:.33}.travelled{stroke:#b4f477;stroke-width:2.8;filter:url(#glow)}.robot-core{fill:#e9ffcf;stroke:#8bef78;stroke-width:2;vector-effect:non-scaling-stroke}.robot-halo{fill:#b4f477;opacity:.18}.toolbox{position:absolute;bottom:22px;right:24px;display:flex;gap:6px}.toolbox button,.icon{background:#17282a;border:1px solid #355049;color:#d0e1d6;border-radius:8px;min-width:35px;height:35px}.toolbox button:hover,.icon:hover{border-color:#b4f477}.zoom-hint{position:absolute;bottom:31px;left:28px;color:#78918a;font-size:11px;pointer-events:none}.controls{height:128px;background:#0b171a;border-top:1px solid #ffffff16;padding:19px 32px 21px;display:flex;flex-direction:column;justify-content:center;gap:13px}.timeline{display:flex;align-items:center;gap:15px}.play{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#122719;font-size:16px;flex:none}.play:hover{background:#ceffa2}.track{flex:1;min-width:0}.track-info{display:flex;justify-content:space-between;font-size:11px;color:#a7bbb0;margin-bottom:8px}.track-info strong{font-weight:500;color:#d8e9d6}.range{width:100%;height:5px;display:block;accent-color:var(--accent);cursor:pointer;margin:0}.control-bottom{display:flex;justify-content:space-between;padding-left:57px;font-size:11px;color:#758d83}.speeds{display:flex;gap:5px;align-items:center}.speed{border:0;background:none;color:#839e8f;padding:2px 6px;border-radius:4px;font-size:11px}.speed.active{color:#d7ffb3;background:#263c2d}.error{display:none;color:#f1b1a3;font-size:12px}.map-hidden .full-route,.map-hidden .travelled,.map-hidden #robot{display:none}@media(max-width:700px){header{height:62px;padding:0 17px}.status{font-size:10px}.workspace{display:block;position:relative}.side{position:absolute;z-index:2;top:15px;left:16px;padding:10px 12px;border:1px solid #ffffff12;border-radius:9px;background:#0b1819d9;gap:0;pointer-events:none}.side .eyebrow,.side .desc,.side .divider,.side .legend,.side .side-bottom,.side .fact{display:none}.section-title{font-size:15px;margin:0}.stage{height:100%}.stage-head{top:76px;left:19px}.stage-right{top:20px;right:17px}.toolbox{right:14px;bottom:14px}.zoom-hint{display:none}.controls{height:119px;padding:17px}.control-bottom{padding-left:56px}.subtitle{font-size:9px}}

</head><body><div class="app"><header><div class="brand"><div class="mark" aria-hidden="true"></div><div><div class="title">海口 · 建图轨迹回放</div><div class="subtitle">HAIKOU / MAPPING REPLAY</div></div></div><div class="status">历史数据演示</div></header><div class="workspace"><aside class="side"><div><div class="eyebrow">MAPPING SESSION / 216</div><h1 class="section-title">看见机器人的<br>每一次探索。</h1><p class="desc">沿记录的位置点回放路线，重新观察这片空间。</p></div><div class="divider"></div><div><div class="eyebrow">地图数据</div><div class="fact"><span>地图块</span><strong>39 块</strong></div><div class="fact"><span>轨迹位置点</span><strong id="point-count">—</strong></div><div class="fact"><span>地图分辨率</span><strong>5 厘米 / 格</strong></div></div><div class="divider"></div><div><div class="eyebrow">图例</div><div class="legend"><i></i> 已回放轨迹</div><div class="legend"><i class="faint"></i> 完整轨迹</div></div><div class="side-bottom">基于原始建图数据重建<br>回放速度为演示设置</div></aside><main class="stage mode-3d" id="stage"><div class="stage-head"><div class="stage-kicker">SPACE / 01</div><div class="stage-name">216 · 二维地图</div></div><div class="stage-right" id="progress-label">回放进度 0%</div><div class="view-switch" role="group" aria-label="选择地图视角"><button id="view-3d" type="button" aria-pressed="true">立体</button><button id="view-2d" type="button" aria-pressed="false">平面</button></div><div class="view-caption" id="view-caption">倾斜视角 · 非真实高度</div><svg class="map" id="map" viewBox="0 0 1080 1347" preserveAspectRatio="xMidYMid meet" aria-label="可缩放和拖动的机器人地图与回放轨迹"><defs><filter id="tint" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-0.55 0 0 0 .58  -0.85 0 0 0 .86  -0.72 0 0 0 .74  0 0 0 1 0"/></filter><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><image class="map-image" href="assets/map.png" x="0" y="0" width="1080" height="1347"></image><path id="all-path" class="full-route"></path><path id="played-path" class="travelled" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"></path><g id="robot"><circle class="robot-halo" r="15"></circle><circle class="robot-core" r="5.8"></circle><path d="M 0 -13 L -4 -6 L 4 -6 Z" fill="#d9ffb6"></path></g></svg><div class="zoom-hint">滚轮缩放 · 拖动地图</div><div class="toolbox"><button id="zoom-in" aria-label="放大地图">＋</button><button id="zoom-out" aria-label="缩小地图">−</button><button id="reset" aria-label="恢复全图">⌂</button></div></main></div><footer class="controls"><div class="timeline"><button class="play" id="play" aria-label="播放轨迹">▶</button><div class="track"><div class="track-info"><span><strong>轨迹回放</strong> <span id="play-status">· 已暂停</span></span><span id="percent">0%</span></div><input class="range" id="seek" type="range" min="0" max="1000" value="0" aria-label="回放进度"></div></div><div class="control-bottom"><span>演示速度，不代表真实行驶速度</span><div class="speeds"><span>速度</span><button class="speed" data-speed="0.5">0.5×</button><button class="speed active" data-speed="1">1×</button><button class="speed" data-speed="2">2×</button></div></div><div class="error" id="error">地图数据加载失败，请刷新页面。</div></footer></div><script src="trajectory.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const data=window.MAP_DATA;if(!data||!data.trajectory||data.trajectory.length<2){$('error').style.display='block';return}const points=data.trajectory;const path=points.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');const all=$('all-path'),played=$('played-path'),robot=$('robot'),map=$('map');all.setAttribute('d',path);played.setAttribute('d',path);$('point-count').textContent=points.length.toLocaleString('zh-CN')+' 个';let length=all.getTotalLength(),progress=0,playing=false,speed=1,last=0;let box={x:0,y:0,w:data.width,h:data.height},drag=null;const duration=55;
function draw(){played.setAttribute('stroke-dashoffset',String(1-progress));let d=length*progress,p=all.getPointAtLength(d),q=all.getPointAtLength(Math.min(length,d+2));let a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI+90;robot.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${a})`);let pct=Math.round(progress*100);$('seek').value=Math.round(progress*1000);$('percent').textContent=pct+'%';$('progress-label').textContent='回放进度 '+pct+'%'}
function setPlay(value){playing=value;$('play').textContent=playing?'❚❚':'▶';$('play').setAttribute('aria-label',playing?'暂停轨迹':'播放轨迹');$('play-status').textContent=playing?'· 正在回放':'· 已暂停';last=0}function tick(t){if(playing){if(last)progress=Math.min(1,progress+(t-last)/1000/duration*speed);last=t;draw();if(progress>=1)setPlay(false)}requestAnimationFrame(tick)}$('play').addEventListener('click',()=>{if(progress>=1)progress=0;setPlay(!playing);draw()});$('seek').addEventListener('input',e=>{progress=Number(e.target.value)/1000;draw()});document.querySelectorAll('.speed').forEach(b=>b.addEventListener('click',()=>{speed=Number(b.dataset.speed);document.querySelectorAll('.speed').forEach(x=>x.classList.toggle('active',x===b))}));
function apply(){map.setAttribute('viewBox',`${box.x} ${box.y} ${box.w} ${box.h}`)}function point(e){let p=map.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(map.getScreenCTM().inverse())}function zoom(f,cx=box.x+box.w/2,cy=box.y+box.h/2){let w=Math.max(data.width/20,Math.min(data.width*4,box.w*f)),h=box.h*w/box.w;box.x=cx-(cx-box.x)*w/box.w;box.y=cy-(cy-box.y)*h/box.h;box.w=w;box.h=h;apply()}map.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(e.deltaY>0?1.15:1/1.15,p.x,p.y)},{passive:false});map.addEventListener('pointerdown',e=>{drag=point(e);map.setPointerCapture(e.pointerId);map.classList.add('dragging')});map.addEventListener('pointermove',e=>{if(!drag)return;let p=point(e);box.x+=drag.x-p.x;box.y+=drag.y-p.y;apply()});function stop(){drag=null;map.classList.remove('dragging')}map.addEventListener('pointerup',stop);map.addEventListener('pointercancel',stop);function setView(is3d){$('stage').classList.toggle('mode-3d',is3d);$('view-3d').setAttribute('aria-pressed',String(is3d));$('view-2d').setAttribute('aria-pressed',String(!is3d));$('view-caption').textContent=is3d?'倾斜视角 · 非真实高度':'平面视角'}$('view-3d').onclick=()=>setView(true);$('view-2d').onclick=()=>setView(false);$('zoom-in').onclick=()=>zoom(.75);$('zoom-out').onclick=()=>zoom(1.33);$('reset').onclick=()=>{box={x:0,y:0,w:data.width,h:data.height};apply()};draw();requestAnimationFrame(tick)})();
</script></body></html>
